<div class="container navigator-container pt-4 pb-3">
  <h1 class="page-header">Navigate smarter: Check out our helpful links</h1>
  <div class="row navigator-tab-list">
    <div class="col-6 mb-3" *ngFor="let tab of navigatorTabsData">
      <div class="navigator-tab">
        <label class="label-text">{{ tab?.label }}</label>
        <img src="{{ tab.icon }}" alt="navigator-icon" />
      </div>
    </div>
  </div>
</div>

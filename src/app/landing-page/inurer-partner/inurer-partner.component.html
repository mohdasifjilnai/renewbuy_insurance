<div class="inurer-partners left-right-container-padding my-inurer-partners">
  <div class="container">
    <div class="row p-0">
      <div class="col-lg-12 col-md-10 p-0">
        <div class="insurance-partners">
          <div class="partners-heading">
            Our Insurance <span class="fw-bold">Partners</span>
          </div>
          <div class="partners-logos my-3">
            <div class="slider">
              @for(insurar of insurer_partner?.data; track insurar?.id){
              <div class="partner-logo-img">
                <img
                  [src]="
                    insurar?.attributes?.insurer_logo?.data?.attributes?.url
                  "
                  [alt]="insurar?.attributes?.alt"
                  class="partner-logo-img-img"
                />
              </div>
              }
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
